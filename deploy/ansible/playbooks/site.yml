# Full bootstrap of a fresh lab stand, in dependency order.
# On brand-new servers only root exists, so run it as:
#   ansible-playbook playbooks/site.yml -e ansible_user=root
# Afterwards (ops user exists) individual playbooks run with the default user.
- import_playbook: base.yml
- import_playbook: wireguard.yml
- import_playbook: docker.yml
- import_playbook: postgres.yml
- import_playbook: deploy-account.yml
- import_playbook: haproxy.yml
