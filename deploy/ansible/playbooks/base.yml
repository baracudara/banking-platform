- name: Base hardening for all lab nodes
  hosts: all
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ufw, curl, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create ops user
      ansible.builtin.user:
        name: "{{ ops_user }}"
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Authorize SSH key for ops user
      ansible.posix.authorized_key:
        user: "{{ ops_user }}"
        key: "{{ lookup('file', ops_pubkey_file) }}"

    - name: Passwordless sudo for ops user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ops_user }}"
        content: "{{ ops_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # 10- prefix: sshd takes the first value it sees, and Ubuntu ships 50-cloud-init.conf
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
        mode: "0644"
        validate: sshd -t -f %s
      notify: Restart sshd

    # SSH must be allowed before ufw is enabled, or the session is cut off
    - name: Allow public TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: "{{ ufw_public_tcp_ports }}"

    - name: Enable ufw with default deny incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
